name: lms_ept
description: "LMS EPT - Application mobile officielle de l'École Polytechnique de Thiès"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3+1

  # Local storage & auth
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.3.0

  # Navigation
  go_router: ^14.2.0

  # State management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  fl_chart: ^0.66.0
  geolocator: ^12.0.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

  # QR Scanner
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.6
  syncfusion_flutter_pdfviewer: ^33.2.5
  webview_flutter: ^4.13.1
  flutter_markdown: ^0.7.7+1
  animate_do: ^5.1.0
  stomp_dart_client: ^3.0.1
  web_socket_channel: ^3.0.3
  path_provider: ^2.1.5
  path: ^1.9.1
  video_player: ^2.11.1
  chewie: ^1.13.1
  flutter_spinkit: ^5.2.2
  youtube_player_flutter: ^9.1.3
  share_plus: ^12.0.2
  livekit_client: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  device_info_plus: 11.1.1
  connectivity_plus: 6.1.1
  web: ^1.0.0
